name: Windows regression tests

on:
  push:
    paths: ['**.py', 'requirements*.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'requirements*.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install -r requirements-release.txt
      - name: Install test codec tools
        run: choco install ffmpeg --yes --no-progress
      - name: Record environment
        run: |
          python --version
          python -m pip freeze
          ffmpeg -version
      - name: Run logic, Tk and real codec regressions
        run: python -B -X utf8 -m unittest discover -s tests -v
